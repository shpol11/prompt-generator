<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- תגיות מטא קריטיות להטמעה בקנבה -->
    <title>מחולל הפרומפט המנצח 🚀</title>
    <meta name="description" content="כלי עזר לתלמידים ליצירת פרומפטים מדויקים לאפליקציות ואתרים.">
    
    <!-- Open Graph / Facebook (קנבה משתמשת בזה) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://shpol11.github.io/prompt-generator/">
    <meta property="og:title" content="מחולל הפרומפט המנצח 🚀">
    <meta property="og:description" content="הפכו רעיון לאפליקציה לפרומפט מושלם עבור בינה מלאכותית.">
    <meta property="og:image" content="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/sparkles.png">

    <!-- Twitter (גם זה עוזר לקנבה לזהות את האתר) -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://shpol11.github.io/prompt-generator/">
    <meta property="twitter:title" content="מחולל הפרומפט המנצח 🚀">
    <meta property="twitter:description" content="הכלי שילמד אתכם לכתוב פרומפטים כמו מקצוענים.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f8fafc;
        }
        .step-transition { transition: all 0.3s ease-in-out; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <div class="max-w-6xl mx-auto px-4 py-8 sm:py-12">
        <header class="text-center mb-12 animate-fade">
            <div class="inline-block p-3 bg-blue-100 rounded-2xl mb-4 text-blue-600">
                <i data-lucide="sparkles" class="w-8 h-8"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-slate-900 mb-3 tracking-tight">המדריך לבניית האפליקציה שלך</h1>
            <p class="text-slate-600 text-lg">בואו נהפוך את הרעיון שלכם להנחיה (פרומפט) שהבינה המלאכותית תבין בשנייה</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="lg:col-span-2 space-y-6">
                <!-- סרגל התקדמות -->
                <nav class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 flex justify-between items-center px-4">
                    <div class="flex flex-1 justify-between relative">
                        <div class="absolute top-6 right-0 left-0 h-1 bg-slate-100 -z-0"></div>
                        <div id="progress-line" class="absolute top-6 right-0 h-1 bg-blue-600 transition-all duration-500 -z-0" style="width: 0%;"></div>
                        
                        <button onclick="goToStep(0)" class="step-btn z-10 flex flex-col items-center group" data-step="0">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center border-4 bg-blue-600 border-blue-100 text-white shadow-lg transition-all duration-300">1</div>
                            <span class="text-xs mt-2 font-bold text-blue-700 hidden sm:block">סיפור</span>
                        </button>
                        <button onclick="goToStep(1)" class="step-btn z-10 flex flex-col items-center group" data-step="1">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300 transition-all duration-300">2</div>
                            <span class="text-xs mt-2 text-slate-400 hidden sm:block">לוגיקה</span>
                        </button>
                        <button onclick="goToStep(2)" class="step-btn z-10 flex flex-col items-center group" data-step="2">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300 transition-all duration-300">3</div>
                            <span class="text-xs mt-2 text-slate-400 hidden sm:block">עיצוב</span>
                        </button>
                        <button onclick="goToStep(3)" class="step-btn z-10 flex flex-col items-center group" data-step="3">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300 transition-all duration-300">4</div>
                            <span class="text-xs mt-2 text-slate-400 hidden sm:block">סיום</span>
                        </button>
                    </div>
                </nav>

                <main class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-slate-200 min-h-[550px] flex flex-col">
                    <div id="step-header" class="p-6 border-b border-slate-100 bg-slate-50/50 flex items-center gap-4"></div>
                    <div id="step-content" class="p-8 flex-grow animate-fade"></div>
                    <footer class="p-6 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                        <button id="prev-btn" onclick="prevStep()" class="flex items-center gap-2 px-6 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-all disabled:opacity-30">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            חזרה
                        </button>
                        <div id="footer-actions"></div>
                    </footer>
                </main>
            </div>

            <aside class="space-y-6">
                <div class="bg-amber-50 rounded-[2rem] p-6 border border-amber-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-4 text-amber-700">
                        <i data-lucide="lightbulb" class="w-6 h-6 fill-amber-500"></i>
                        <h3 class="font-bold text-lg">טיפים מהמומחים</h3>
                    </div>
                    <ul id="tips-list" class="space-y-4 text-sm text-amber-900 leading-relaxed"></ul>
                </div>

                <div class="bg-white rounded-[2rem] p-6 border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-4 text-slate-800 font-bold">
                        <i data-lucide="info" class="w-5 h-5 text-blue-500"></i>
                        <span>האפליקציה שלך תקבל:</span>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between text-xs items-center">
                            <span class="text-slate-500">עיצוב רספונסיבי (מובייל)</span>
                            <span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">V</span>
                        </div>
                        <div class="flex justify-between text-xs items-center">
                            <span class="text-slate-500">הסברים בעברית בקוד</span>
                            <span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">V</span>
                        </div>
                        <div class="flex justify-between text-xs items-center">
                            <span class="text-slate-500">קוד נקי ללא ספריות</span>
                            <span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">V</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 right-1/2 translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50">
        הפרומפט הועתק! עכשיו עברו ל-Gemini והדביקו.
    </div>

    <script>
        let currentStep = 0;
        const formData = { appType: '', targetAudience: '', problem: '', actions: '', inputs: '', outputs: '', style: 'מודרני', colors: '', buttonStyle: 'עגולים' };

        const steps = [
            {
                title: "הלב של האפליקציה",
                subtitle: "מה אנחנו בונים ולמי?",
                icon: "heart",
                iconColor: "text-red-500",
                tips: ["חשבו על בעיה שמעצבנת אתכם ביום-יום.", "ככל שתהיו יותר ספציפיים לגבי קהל היעד, התוצאה תהיה טובה יותר."],
                fields: [
                    { key: 'appType', label: 'סוג האפליקציה', placeholder: 'למשל: יומן תזכורות, משחק טריוויה...' },
                    { key: 'targetAudience', label: 'קהל היעד', placeholder: 'למשל: תלמידי כיתה ז...' },
                    { key: 'problem', label: 'הבעיה שאתם פותרים', placeholder: 'למשל: אנשים שוכחים להשקות את הצמחים...' }
                ]
            },
            {
                title: "המוח והלוגיקה",
                subtitle: "איך זה אמור לעבוד?",
                icon: "brain",
                iconColor: "text-blue-500",
                tips: ["תיאור טוב כולל קלט ופלט.", "בקשו שמירה בדפדפן כדי שהנתונים לא יימחקו."],
                quickFills: [
                    { label: "שמירת נתונים", text: "הוסף שמירה ב-LocalStorage כדי שיישמר." },
                    { label: "מצב לילה", text: "הוסף כפתור שמחליף בין עיצוב בהיר לכהה." }
                ],
                fields: [
                    { key: 'actions', label: 'מה קורה כשלוחצים על כפתורים?', placeholder: 'למשל: לחיצה מוסיפה נקודה...' },
                    { key: 'inputs', label: 'מה המשתמש מקליד?', placeholder: 'למשל: שם משתמש...' },
                    { key: 'outputs', label: 'מה המשתמש רואה?', placeholder: 'למשל: הודעת הצלחה...' }
                ]
            },
            {
                title: "הסטייל והווייב",
                subtitle: "איך זה ייראה?",
                icon: "palette",
                iconColor: "text-purple-500",
                tips: ["צבעים מעבירים רגש.", "עיצוב מינימליסטי הוא תמיד בחירה טובה."],
                options: [
                    { key: 'style', label: 'סגנון עיצוב', choices: ['מודרני', 'מינימליסטי', 'רטרו', 'צבעוני'] },
                    { key: 'buttonStyle', label: 'סגנון כפתורים', choices: ['גדולים', 'עגולים', 'תלת-ממדיים'] }
                ],
                fields: [
                    { key: 'colors', label: 'צבעים מועדפים', placeholder: 'למשל: רקע לבן עם כפתורים בסגול...' }
                ]
            },
            {
                title: "הפרומפט המנצח",
                subtitle: "הכל מוכן!",
                icon: "sparkles",
                iconColor: "text-yellow-500",
                tips: ["העתיקו את הקוד המלא שה-AI ייתן לכם.", "שמרו את הקוד בקובץ בשם index.html."]
            }
        ];

        function initApp() { render(); lucide.createIcons(); }

        function render() {
            const data = steps[currentStep];
            document.getElementById('step-header').innerHTML = `<div class="p-3 bg-white rounded-2xl shadow-sm border border-slate-100 ${data.iconColor}"><i data-lucide="${data.icon}" class="w-6 h-6"></i></div><div><h2 class="text-2xl font-bold text-slate-800">${data.title}</h2><p class="text-slate-500 text-sm">${data.subtitle}</p></div>`;
            document.getElementById('tips-list').innerHTML = data.tips.map(tip => `<li class="flex gap-3 items-start"><div class="w-1.5 h-1.5 bg-amber-400 rounded-full mt-1.5 shrink-0"></div><span>${tip}</span></li>`).join('');

            const content = document.getElementById('step-content');
            content.classList.remove('animate-fade'); void content.offsetWidth; content.classList.add('animate-fade');

            if (currentStep < 3) {
                let html = '<div class="space-y-6">';
                if (data.quickFills) {
                    html += `<div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 mb-6 flex flex-wrap gap-2">${data.quickFills.map(f => `<button onclick="addQuickFill('${f.text}')" class="bg-white hover:bg-blue-600 hover:text-white text-blue-600 border border-blue-200 px-3 py-1.5 rounded-xl text-xs font-semibold Shadow-sm">+ ${f.label}</button>`).join('')}</div>`;
                }
                if (data.options) {
                    data.options.forEach(opt => {
                        html += `<div><label class="block text-sm font-bold text-slate-700 mb-3">${opt.label}</label><div class="flex flex-wrap gap-2">
                            ${opt.choices.map(choice => `<button onclick="updateFormData('${opt.key}', '${choice}')" class="px-5 py-2.5 rounded-xl text-sm font-medium border-2 ${formData[opt.key] === choice ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-100'}">${choice}</button>`).join('')}
                        </div></div>`;
                    });
                }
                data.fields.forEach(f => {
                    html += `<div><label class="block text-sm font-bold text-slate-700 mb-2">${f.label}</label><textarea oninput="updateFormData('${f.key}', this.value)" rows="2" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none text-slate-800" placeholder="${f.placeholder}">${formData[f.key]}</textarea></div>`;
                });
                content.innerHTML = html + '</div>';
            } else {
                content.innerHTML = `<div class="space-y-6"><div class="bg-green-50 border border-green-100 p-5 rounded-2xl flex gap-4 items-start shadow-sm"><i data-lucide="check-circle-2" class="w-8 h-8 text-green-600"></i><div><h4 class="font-bold text-green-900">הנחיה מוכנה!</h4><p class="text-sm text-green-800">העתיקו את הטקסט למטה והדביקו ב-Gemini.</p></div></div><div class="relative group"><div id="final-prompt" class="w-full h-80 p-6 bg-slate-900 text-slate-300 rounded-3xl font-mono text-sm overflow-auto whitespace-pre-wrap border-4 border-slate-800 scrollbar-hide">${generateFinalPrompt()}</div><button onclick="copyPrompt()" class="absolute bottom-6 left-6 flex items-center gap-2 px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-2xl hover:bg-blue-700 transition-all"><i data-lucide="copy" class="w-5 h-5"></i> העתק</button></div></div>`;
            }

            document.getElementById('prev-btn').disabled = currentStep === 0;
            document.getElementById('footer-actions').innerHTML = currentStep < 3 ? `<button onclick="nextStep()" class="flex items-center gap-2 px-8 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-200 transition-all">המשך <i data-lucide="chevron-left" class="w-5 h-5"></i></button>` : `<button onclick="goToStep(0)" class="px-6 py-3 text-blue-600 font-bold hover:underline">התחלה מחדש</button>`;
            updateProgressBar(); lucide.createIcons();
        }

        function updateFormData(key, value) { formData[key] = value; if (currentStep === 3) render(); }
        function addQuickFill(text) { formData.actions += (formData.actions ? " " : "") + text; render(); }
        function nextStep() { if (currentStep < 3) { currentStep++; render(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; render(); } }
        function goToStep(s) { currentStep = s; render(); }
        function updateProgressBar() {
            const line = document.getElementById('progress-line');
            line.style.width = (currentStep / 3) * 100 + "%";
            document.querySelectorAll('.step-btn').forEach((btn, idx) => {
                const circle = btn.querySelector('div');
                if (idx < currentStep) circle.className = "w-12 h-12 rounded-full flex items-center justify-center border-4 bg-green-500 border-green-100 text-white";
                else if (idx === currentStep) circle.className = "w-12 h-12 rounded-full flex items-center justify-center border-4 bg-blue-600 border-blue-100 text-white shadow-lg scale-110";
                else circle.className = "w-12 h-12 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300";
            });
        }
        function generateFinalPrompt() {
            return `היי, אני רוצה לבנות אפליקציית Web שהיא ${formData.appType || "[סוג]"} עבור ${formData.targetAudience || "[קהל]"}. המטרה: ${formData.problem}.

פעולות: ${formData.actions}
קלט: ${formData.inputs}
תצוגה: ${formData.outputs}

עיצוב: סגנון ${formData.style}, צבעים: ${formData.colors}, כפתורים: ${formData.buttonStyle}.
כתוב הכל בקובץ HTML אחד עם הערות בעברית.`;
        }
        function copyPrompt() {
            const text = generateFinalPrompt();
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1'; toast.style.transform = 'translate(-50%, 0)';
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translate(-50%, 1rem)'; }, 3000);
            });
        }
        window.onload = initApp;
    </script>
</body>
</html>
