<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- תגיות מטא לזיהוי ככלי אינטראקטיבי בקנבה -->
    <title>מחולל הפרומפט המנצח 🚀</title>
    <meta name="description" content="אפליקציה אינטראקטיבית ליצירת פרומפטים">
    
    <link rel="canonical" href="https://shpol11.github.io/prompt-generator/" />
    
    <!-- Open Graph המיועד להטמעה חיה -->
    <meta property="og:site_name" content="מחולל הפרומפט המנצח">
    <meta property="og:title" content="מחולל הפרומפט המנצח 🚀">
    <meta property="og:description" content="התחילו ליצור את האפליקציה שלכם כאן">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://shpol11.github.io/prompt-generator/">
    
    <!-- הגדרות תצוגה לאייפראם -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .step-transition { transition: all 0.3s ease-in-out; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <div class="max-w-6xl mx-auto px-4 py-6 sm:py-10">
        <header class="text-center mb-8 animate-fade">
            <div class="inline-block p-3 bg-blue-100 rounded-2xl mb-4 text-blue-600">
                <i data-lucide="sparkles" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">המדריך לבניית האפליקציה שלך</h1>
            <p class="text-slate-600">הפכו רעיון לפרומפט מושלם עבור בינה מלאכותית</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            <div class="lg:col-span-2 space-y-6">
                <!-- סרגל התקדמות -->
                <nav class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 flex justify-between items-center px-4">
                    <div class="flex flex-1 justify-between relative">
                        <div class="absolute top-6 right-0 left-0 h-1 bg-slate-100 -z-0"></div>
                        <div id="progress-line" class="absolute top-6 right-0 h-1 bg-blue-600 transition-all duration-500 -z-0" style="width: 0%;"></div>
                        
                        <button onclick="goToStep(0)" class="step-btn z-10 flex flex-col items-center group" data-step="0">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center border-4 bg-blue-600 border-blue-100 text-white shadow-lg transition-all duration-300">1</div>
                        </button>
                        <button onclick="goToStep(1)" class="step-btn z-10 flex flex-col items-center group" data-step="1">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300 transition-all duration-300">2</div>
                        </button>
                        <button onclick="goToStep(2)" class="step-btn z-10 flex flex-col items-center group" data-step="2">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300 transition-all duration-300">3</div>
                        </button>
                        <button onclick="goToStep(3)" class="step-btn z-10 flex flex-col items-center group" data-step="3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300 transition-all duration-300">4</div>
                        </button>
                    </div>
                </nav>

                <main class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-slate-200 min-h-[480px] flex flex-col">
                    <div id="step-header" class="p-5 border-b border-slate-100 bg-slate-50/50 flex items-center gap-4"></div>
                    <div id="step-content" class="p-6 flex-grow animate-fade"></div>
                    <footer class="p-5 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                        <button id="prev-btn" onclick="prevStep()" class="flex items-center gap-2 px-5 py-2 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-all disabled:opacity-30">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i> חזרה
                        </button>
                        <div id="footer-actions"></div>
                    </footer>
                </main>
            </div>

            <aside class="space-y-6">
                <div class="bg-amber-50 rounded-[2rem] p-6 border border-amber-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-4 text-amber-700">
                        <i data-lucide="lightbulb" class="w-6 h-6 fill-amber-500"></i>
                        <h3 class="font-bold">טיפים</h3>
                    </div>
                    <ul id="tips-list" class="space-y-3 text-sm text-amber-900 leading-relaxed"></ul>
                </div>
                <div class="bg-blue-600 rounded-[2rem] p-5 text-white shadow-lg">
                    <p class="text-xs opacity-90 font-bold italic">"ה-AI הוא העוזר שלכם. תהיו ספציפיים!"</p>
                </div>
            </aside>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 right-1/2 translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        הפרומפט הועתק!
    </div>

    <script>
        let currentStep = 0;
        const formData = { appType: '', targetAudience: '', problem: '', actions: '', inputs: '', outputs: '', style: 'מודרני', colors: '', buttonStyle: 'עגולים' };

        const steps = [
            {
                title: "הלב של האפליקציה",
                subtitle: "מה אנחנו בונים ולמי?",
                icon: "heart", iconColor: "text-red-500",
                tips: ["חשבו על בעיה שמעצבנת אתכם.", "קהל יעד מדויק עוזר ל-AI."],
                fields: [
                    { key: 'appType', label: 'סוג האפליקציה', placeholder: 'למשל: יומן תזכורות...' },
                    { key: 'targetAudience', label: 'קהל היעד', placeholder: 'למשל: תלמידי כיתה ז...' },
                    { key: 'problem', label: 'הבעיה שאתם פותרים', placeholder: 'למשל: שכחה של השקיית צמחים...' }
                ]
            },
            {
                title: "המוח והלוגיקה",
                subtitle: "איך זה עובד?",
                icon: "brain", iconColor: "text-blue-500",
                tips: ["ציינו מה המשתמש מקליד.", "בקשו שמירה בדפדפן."],
                quickFills: [{ label: "שמירת נתונים", text: "הוסף שמירה ב-LocalStorage." }, { label: "מצב לילה", text: "הוסף כפתור מצב לילה." }],
                fields: [
                    { key: 'actions', label: 'פעולות כפתורים', placeholder: 'מה קורה כשלוחצים?' },
                    { key: 'inputs', label: 'קלט משתמש', placeholder: 'מה מקלידים?' },
                    { key: 'outputs', label: 'תצוגה', placeholder: 'מה רואים בסוף?' }
                ]
            },
            {
                title: "הסטייל והווייב",
                subtitle: "איך זה ייראה?",
                icon: "palette", iconColor: "text-purple-500",
                tips: ["ירוק זה טבעי.", "עיצוב נקי זה תמיד טוב."],
                options: [
                    { key: 'style', label: 'סגנון', choices: ['מודרני', 'מינימליסטי', 'רטרו', 'צבעוני'] },
                    { key: 'buttonStyle', label: 'כפתורים', choices: ['גדולים', 'עגולים', 'תלת-ממדיים'] }
                ],
                fields: [{ key: 'colors', label: 'צבעים', placeholder: 'למשל: כחול ולבן...' }]
            },
            {
                title: "הפרומפט המנצח",
                subtitle: "הכל מוכן!",
                icon: "sparkles", iconColor: "text-yellow-500",
                tips: ["העתיקו הכל ל-Gemini.", "שמרו כ-index.html."]
            }
        ];

        function initApp() { render(); lucide.createIcons(); }

        function render() {
            const data = steps[currentStep];
            document.getElementById('step-header').innerHTML = `<div class="p-3 bg-white rounded-xl border border-slate-100 ${data.iconColor}"><i data-lucide="${data.icon}" class="w-6 h-6"></i></div><div><h2 class="text-xl font-bold text-slate-800">${data.title}</h2><p class="text-slate-500 text-xs">${data.subtitle}</p></div>`;
            document.getElementById('tips-list').innerHTML = data.tips.map(tip => `<li class="flex gap-2 items-start"><div class="w-1 h-1 bg-amber-400 rounded-full mt-2 shrink-0"></div><span>${tip}</span></li>`).join('');

            const content = document.getElementById('step-content');
            content.classList.remove('animate-fade'); void content.offsetWidth; content.classList.add('animate-fade');

            if (currentStep < 3) {
                let html = '<div class="space-y-4">';
                if (data.quickFills) html += `<div class="flex flex-wrap gap-2">${data.quickFills.map(f => `<button onclick="addQuickFill('${f.text}')" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-xs font-bold border border-blue-100">+ ${f.label}</button>`).join('')}</div>`;
                if (data.options) data.options.forEach(opt => {
                    html += `<div><label class="block text-xs font-bold text-slate-600 mb-2">${opt.label}</label><div class="flex flex-wrap gap-2">
                        ${opt.choices.map(choice => `<button onclick="updateFormData('${opt.key}', '${choice}')" class="px-3 py-1.5 rounded-lg text-xs border ${formData[opt.key] === choice ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-100'}">${choice}</button>`).join('')}
                    </div></div>`;
                });
                data.fields.forEach(f => { html += `<div><label class="block text-xs font-bold text-slate-600 mb-1">${f.label}</label><textarea oninput="updateFormData('${f.key}', this.value)" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm text-slate-800" placeholder="${f.placeholder}">${formData[f.key]}</textarea></div>`; });
                content.innerHTML = html + '</div>';
            } else {
                content.innerHTML = `<div class="space-y-4"><div class="bg-green-50 p-4 rounded-xl flex gap-3"><i data-lucide="check-circle" class="text-green-600"></i><p class="text-sm text-green-800">הפרומפט מוכן! העתיקו אותו ל-Gemini.</p></div><div class="relative"><div id="final-prompt" class="w-full h-64 p-4 bg-slate-900 text-slate-300 rounded-2xl font-mono text-xs overflow-auto leading-relaxed border-4 border-slate-800">${generateFinalPrompt()}</div><button onclick="copyPrompt()" class="absolute bottom-4 left-4 bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg text-sm hover:bg-blue-700 transition-all">העתק</button></div></div>`;
            }

            document.getElementById('prev-btn').disabled = currentStep === 0;
            document.getElementById('footer-actions').innerHTML = currentStep < 3 ? `<button onclick="nextStep()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg transition-all text-sm">המשך</button>` : `<button onclick="goToStep(0)" class="text-blue-600 font-bold text-sm">התחלה מחדש</button>`;
            updateProgressBar(); lucide.createIcons();
        }

        function updateFormData(key, value) { formData[key] = value; if (currentStep === 3) render(); }
        function addQuickFill(text) { formData.actions += (formData.actions ? " " : "") + text; render(); }
        function nextStep() { if (currentStep < 3) { currentStep++; render(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; render(); } }
        function goToStep(s) { currentStep = s; render(); }
        function updateProgressBar() {
            const line = document.getElementById('progress-line'); line.style.width = (currentStep / 3) * 100 + "%";
            document.querySelectorAll('.step-btn div').forEach((circle, idx) => {
                if (idx < currentStep) circle.className = "w-10 h-10 rounded-full flex items-center justify-center border-4 bg-green-500 border-green-100 text-white";
                else if (idx === currentStep) circle.className = "w-10 h-10 rounded-full flex items-center justify-center border-4 bg-blue-600 border-blue-100 text-white shadow-lg scale-110";
                else circle.className = "w-10 h-10 rounded-full flex items-center justify-center border-4 bg-white border-slate-100 text-slate-300";
            });
        }
        function generateFinalPrompt() {
            return `היי, אני רוצה לבנות אפליקציית Web שהיא ${formData.appType || "[סוג]"} עבור ${formData.targetAudience || "[קהל]"}. המטרה: ${formData.problem}.
איך זה עובד: ${formData.actions}
קלט: ${formData.inputs}
תצוגה: ${formData.outputs}
עיצוב: סגנון ${formData.style}, צבעים: ${formData.colors}, כפתורים: ${formData.buttonStyle}.
כתוב הכל בקובץ HTML אחד עם הערות בעברית.`;
        }
        function copyPrompt() {
            const text = generateFinalPrompt();
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast'); toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 3000);
            });
        }
        window.onload = initApp;
    </script>
</body>
</html>
